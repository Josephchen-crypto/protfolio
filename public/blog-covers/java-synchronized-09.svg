  <text x="104" y="255" fill="#67D9FF" font-size="23" font-weight="700">Thread A</text>
  <text x="104" y="308" fill="#E5F3FF" font-size="19">acquire lock</text>
  <text x="104" y="352" fill="#E5F3FF" font-size="19">enter critical section</text>
  <text x="104" y="396" fill="#71E5BC" font-size="19">count++</text>

  <rect x="848" y="214" width="280" height="250" rx="20" fill="#15152D" stroke="#8A70FF" stroke-width="2"/>
  <text x="880" y="255" fill="#B69EFF" font-size="23" font-weight="700">Thread B</text>
  <text x="880" y="308" fill="#EFEAFF" font-size="19">same lock</text>
  <text x="880" y="352" fill="#FFB6C5" font-size="19">wait</text>
  <text x="880" y="396" fill="#EFEAFF" font-size="19">enter after release</text>

  <rect x="448" y="194" width="304" height="300" rx="26" fill="#0A221D" stroke="#38E8A7" stroke-width="3"/>
  <text x="600" y="246" text-anchor="middle" fill="#6BEBC1" font-size="24" font-weight="700">Counter object</text>
