<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050A13"/><stop offset=".58" stop-color="#0A1425"/><stop offset="1" stop-color="#0E1B18"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4FC3F7"/><stop offset=".52" stop-color="#617DFF"/><stop offset="1" stop-color="#38E8A7"/></linearGradient>
