<rect width="1200" height="630" fill="url(#bg)"/>
<text x="72" y="72" fill="#5EE7FF" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">JAVA CONCURRENCY</text>
<text x="72" y="126" fill="#EEF7FF" font-family="Arial" font-size="48" font-weight="700">SYNCHRONIZED · INTRINSIC LOCK</text>
<text x="1090" y="86" text-anchor="end" fill="#55E7B9" font-family="Arial" font-size="62">09</text>

<g font-family="Arial">
